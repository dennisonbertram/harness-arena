name: Passive agent monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: passive-agent-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect Development and production read-only status
        shell: bash
        env:
          OPS_READ_TOKEN: ${{ secrets.HARNESS_ARENA_DEVELOPMENT_OPS_READ_TOKEN }}
          HARNESS_ARENA_DEVELOPMENT_URL: ${{ vars.HARNESS_ARENA_DEVELOPMENT_URL }}
        run: |
          set +e
          pnpm ops:status --env development --json > development-status.json
          development_exit=$?
          env -u OPS_READ_TOKEN pnpm ops:status --env production --json > production-status.json
          production_exit=$?
          test -s development-status.json || printf '{"verdict":"failed","findings":[{"code":"monitor_status_missing","severity":"failed"}]}' > development-status.json
          test -s production-status.json || printf '{"verdict":"access_blocked","blockers":[{"code":"production_access_blocked","severity":"access"}]}' > production-status.json
          printf 'development=%s\nproduction=%s\n' "$development_exit" "$production_exit" >> "$GITHUB_OUTPUT"
      - name: Read existing automated incidents
        id: incidents
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --state all --label agent-monitor --limit 100 --json number,state,body > incidents.json
      - name: Build sanitized incident plans
        run: |
          node scripts/ops/passive-monitor.mjs --environment development --status development-status.json --incidents incidents.json --output development-plan.json || true
          node scripts/ops/passive-monitor.mjs --environment production --status production-status.json --incidents incidents.json --output production-plan.json || true
      - name: Retain sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passive-agent-monitor-${{ github.run_id }}
          path: |-
            development-status.json
            production-status.json
            development-plan.json
            production-plan.json
          retention-days: 14
      - name: Apply deduplicated GitHub incident plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/apply-passive-monitor-plan.mjs development-plan.json production-plan.json
